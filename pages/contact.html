<main id="main">
<div class="container page-head"><h1 class="h2 display">Contact us</h1><p>Questions about an order or a tea? Write to us.</p></div><div class="container pb-5"><div class="auth-split"><div class="auth-photo d-none d-lg-block" data-photo="contact"></div><form class="needs-validation glass form-card" novalidate data-success="Thanks. This demo form does not send messages yet.">
<div class="mb-3"><label class="form-label" for="cn">Name</label><input id="cn" aria-describedby="cn-err" class="form-control" name="name" required autocomplete="name"><div class="invalid-feedback" id="cn-err">Enter your name.</div></div>
<div class="mb-3"><label class="form-label" for="ce">Email</label><input id="ce" aria-describedby="ce-err" type="email" class="form-control" name="email" required autocomplete="email"><div class="invalid-feedback" id="ce-err">Enter a valid email.</div></div>
<div class="mb-3"><label class="form-label" for="cm">Message</label><textarea id="cm" aria-describedby="cm-err" class="form-control" rows="4" name="message" required minlength="10"></textarea><div class="invalid-feedback" id="cm-err">Write at least 10 characters.</div></div><button class="btn btn-forest w-100">Send message</button></form></div></div>
</main>
